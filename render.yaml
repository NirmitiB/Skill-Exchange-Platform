services:
  - type: web
    name: skill-swap-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skill-swap-db
          property: connectionString

databases:
  - name: skill-swap-db
    plan: free
